name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest

      - name: configure (${{ matrix.mode }})
        run: xmake f -p windows -a x64 -m ${{ matrix.mode }} -y

      - name: build
        run: xmake -y

      - name: locate lib
        id: lib
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Recurse -Filter "DuiLib.lib" | Select-Object -First 1
          "path=$($lib.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: DuiLib-windows-x64-${{ matrix.mode }}
          path: ${{ steps.lib.outputs.path }}
          if-no-files-found: error
